plugins {
    id 'java'
    id "org.sonarqube" version "4.4.1.3373"
    id 'jacoco'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
jacoco {
    toolVersion = "0.8.8"
}

jacocoTestReport {
    dependsOn test // Asegura que se corran los tests antes
    reports {
        xml.required = true
        html.required = true
    }
}

